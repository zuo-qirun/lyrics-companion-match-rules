name: 校验示例规则包

on:
  push:
    paths: ["examples/**", "tools/**", "schema/**", ".github/workflows/**"]
  pull_request:
    paths: ["examples/**", "tools/**", "schema/**", ".github/workflows/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 校验规则包
        run: node tools/validate-rules.mjs
